<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Repair NEW</title>
    
    <!-- PWA primary configurations -->
    <link rel="manifest" href="manifest.json" />
    <link rel="shortcut icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <meta name="theme-color" content="#121212" />
    
    <!-- Apple standalone app support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Repair NEW" />
  </head>
  <body class="bg-[#121212]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Register dynamic Service Worker for PWA installation capability -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Unregister any old/conflicting root service workers that were accidentally loaded from domain root
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (let registration of registrations) {
              const currentPath = window.location.pathname; // e.g., "/ffff/"
              const swScope = new URL(registration.scope).pathname; // e.g., "/"
              
              // If we are in a subfolder but the registered service worker's scope is the root "/", unregister it to avoid conflict
              if (swScope === '/' && currentPath !== '/') {
                console.log('Unregistering conflicting root service worker:', registration.scope);
                registration.unregister();
              }
            }
          }).catch((e) => console.error('Error cleaning up old service workers:', e));

          // Now register the correct relative service worker
          navigator.serviceWorker.register('sw.js')
            .then((reg) => {
              console.log('PWA Service Worker registered successfully with scope:', reg.scope);
            })
            .catch((err) => {
              console.error('Service Worker registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
